name: Release policy (local artifacts only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require locally deployed release artifacts
        run: |
          echo "::error::Cloud rebuilds are disabled. Build, test and deploy Manager with tools/release/build_deploy_local.ps1 -Component Manager in the EFF main checkout, then use its local release packaging workflow to upload those verified artifacts. See docs/release-management.md."
          exit 1
